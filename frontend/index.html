<!doctype html>
<html lang="en" ng-app="tablepulse" ng-strict-di>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TablePulse</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body ng-controller="ShellCtrl as shell" ng-cloak>
  <header class="topbar">
    <a class="logo" href="#!/">Table<span>Pulse</span></a>
    <nav aria-label="Main">
      <a href="#!/" ng-class="{ active: shell.isActive('/') }">Home</a>
      <a href="#!/reserve" ng-class="{ active: shell.isActive('/reserve') }">Reserve</a>
      <a href="#!/my-reservations" ng-if="shell.auth.isSignedIn()" ng-class="{ active: shell.isActive('/my-reservations') }">My Reservations</a>
      <a href="#!/dashboard" ng-if="shell.auth.isManager()" ng-class="{ active: shell.isActive('/dashboard') }">Dashboard</a>
      <a href="#!/floor" ng-if="shell.auth.isManager()" ng-class="{ active: shell.isActive('/floor') }">Floor Plan</a>
    </nav>
    <div class="who" ng-if="shell.auth.isSignedIn()">
      <span class="muted">{{ shell.auth.isManager() ? 'Manager' : shell.auth.user().name }}</span>
      <button class="btn ghost sm" type="button" ng-click="shell.signOut()">Sign out</button>
    </div>
    <a class="btn sm" href="#!/sign-in" ng-if="!shell.auth.isSignedIn()">Sign In</a>
  </header>

  <main ng-view></main>

  <footer>TablePulse · Portfolio demo. Not a real restaurant.</footer>

  <!-- AngularJS 1.8.2 (vendored, MIT) -->
  <script src="vendor/angular.min.js"></script>
  <script src="vendor/angular-route.min.js"></script>

  <!-- App: order matters (env, module, core, components, pages) -->
  <script src="js/env.js"></script>
  <script src="js/app.js"></script>
  <script src="js/core/models.js"></script>
  <script src="js/core/date.js"></script>
  <script src="js/core/validation.js"></script>
  <script src="js/core/engine.js"></script>
  <script src="js/core/api-error.js"></script>
  <script src="js/core/api.mock.js"></script>
  <script src="js/core/api.http.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/app-config.js"></script>
  <script src="js/core/interceptor.js"></script>
  <script src="js/components/reveal.js"></script>
  <script src="js/components/reservation-item.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/sign-in.js"></script>
  <script src="js/pages/reserve.js"></script>
  <script src="js/pages/my-reservations.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/floor.js"></script>
</body>
</html>
