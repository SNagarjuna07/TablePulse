name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (real MongoDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A real MongoDB 7 runs next to the tests, so the double-booking protection is tested on the real thing.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      MONGODB_URI: mongodb://localhost:27017/tablepulse
      MONGODB_URI_TEST: mongodb://localhost:27017/tablepulse_test
      JWT_SECRET: ci-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Automated tests (77)
        run: npm test

      - name: Double-booking proof (10 guests, 1 table)
        run: npm run seed && npm run demo:overlap

      - name: Cancel race proof (20 double clicks, 1 winner)
        run: npm run demo:cancel-race

  frontend:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every JavaScript file parses
        run: |
          find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "All frontend files parse."